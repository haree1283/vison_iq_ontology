<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}NH5 Highway{% endblock %} &middot; NH5 Highway</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h1l1.5-5h13L20 17h1M5.5 12l1-3.5a2 2 0 0 1 2-1.5h7a2 2 0 0 1 2 1.5l1 3.5M5 17v2M19 17v2"/><circle cx="7.5" cy="17" r="1.2" fill="#fff" stroke="none"/><circle cx="16.5" cy="17" r="1.2" fill="#fff" stroke="none"/></svg>
      </span>
      <span class="brand-text">NH5 Highway<span>Detection console</span></span>
    </a>
    <nav class="nav">
      <a class="nav-link {{ 'active' if request.path == url_for('index') }}" href="{{ url_for('index') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 21h14"/></svg>
        Upload video
      </a>
      <a class="nav-link {{ 'active' if request.path.startswith('/library') }}" href="{{ url_for('library') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Library
      </a>
      <a class="nav-link {{ 'active' if request.path.startswith('/scenes') }}" href="{{ url_for('scenes') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg>
        Road maps
      </a>
      <a class="nav-link {{ 'active' if request.path.startswith('/live') }}" href="{{ url_for('live') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-4v12l-6-4"/></svg>
        Live camera
      </a>
      <a class="nav-link {{ 'active' if request.path.startswith('/model') }}" href="{{ url_for('model_info') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        Model
      </a>
    </nav>
    <div class="sidebar-footer"><span class="dot"></span>device: {{ device }}</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1>{% block page_title %}{% endblock %}</h1>
      <p>{% block page_sub %}{% endblock %}</p>
    </div>
    <div class="page">{% block content %}{% endblock %}</div>
  </div>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
